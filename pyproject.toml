[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hct_bootstrap"
version = "0.2.0"
requires-python = ">=3.8"
authors = [
  {name = "Ophira Blumner", email = "ophirablumner@gmail.com" },
  {name = "Alon Kipnis", email = "alon.kipnis@runi.ac.il"}
]
maintainers = [
    {name = "Ophira Blumner", email = "ophirablumner@gmail.com" }
]
description = "A package using the Higher Criticism statistic to find discriminating words in two text corpora." 
readme = "README.md"

license = "MIT"
license-files = ["LICENSE"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Linguistic",
    "Development Status :: 3 - Alpha"
]
keywords = ["higher criticism", "stylometry", "text analysis", "nlp", "llm", "discriminating words"]
dependencies = [
    "pandas",   
    "numpy",
    "spacy<3.8",          
    "scikit-learn",
    "scipy"
    #"en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl"
]

[project.optional-dependencies]
display = ["ipython", "matplotlib"]
#For enhanced display: pip install hct_bootstrap[display]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/oblumner/hct_bootstrap"